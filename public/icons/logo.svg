<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo: quadrado arredondado preto -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0D0D0D"/>

  <!-- Barras de resultados (amarelo translúcido) -->
  <g fill="#FFD100" opacity="0.28">
    <rect x="128" y="216" width="46" height="94" rx="23"/>
    <rect x="200" y="170" width="46" height="140" rx="23"/>
    <rect x="272" y="124" width="46" height="186" rx="23"/>
  </g>

  <!-- Linha de crescimento que termina em check -->
  <path d="M 124 252 L 222 154 L 284 216 L 380 100"
