  <!-- Nome do app -->
  <text x="256" y="420" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="84" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Elei<tspan fill="#FFD100">ç</tspan>ão</text>
